# tmux for named agents: socket `tmux -u -L agents`, driven by agentctl and
# the launcher. install.sh copies this to ~/.config/agents/tmux.conf.

# mosh keeps no scrollback of its own, so scrolling happens in tmux
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# The terminal tab title follows the session: `<project>/<name>`
set -g set-titles on
set -g set-titles-string "#S"
set -g status-left "[#S] "
set -g status-left-length 40
set -g status-right "#h"

[project]
name = "devbox-launcher"
version = "0.2.0"
description = "Web UI and CLI for named, long-lived Claude Code agents on a headless dev box"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miika Arponen" }]
keywords = ["claude", "claude-code", "tmux", "tailscale", "remote-control"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
agentctl = "launcher.agents.cli:main"

[project.urls]
Homepage = "https://github.com/Nomafin/devbox-launcher"
Issues = "https://github.com/Nomafin/devbox-launcher/issues"

[build-system]
# >=77 for PEP 639 license metadata (the `license = "MIT"` string form above);
# 68 would resolve fine and then fail the build on an offline or pinned index.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["launcher", "launcher.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
